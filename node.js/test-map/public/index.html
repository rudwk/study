<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Google Maps 장소 검색</title>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 90%;
      height: 600px;
      margin-top: 20px;
      border-radius: 10px;
    }
    #searchBox {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>📍 Google Maps 장소 검색</h2>

  <div id="searchBox">
    <input type="text" id="query" placeholder="예: 서울 카페" value="서울 카페" />
    <button onclick="searchPlaces()">검색</button>
  </div>

  <div id="map"></div>

  <script>
    let map;

    async function loadGoogleMaps() {
      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyAlPexgluzTFYxIsiQPNjxXSAlBJq9IkuU&callback=initMap&language=ko`;
      script.async = true;
      document.head.appendChild(script);
    }

    async function initMap() {
      const center = { lat: 37.5665, lng: 126.9780 };
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center,
      });

      await searchPlaces();
    }

    async function searchPlaces() {
      const query = document.getElementById("query").value;
      const response = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
      const places = await response.json();

      map.setCenter({ lat: 37.5665, lng: 126.9780 });

      places.forEach(place => {
        if (!place.geometry) return;

        const marker = new google.maps.Marker({
          position: place.geometry.location,
          map,
          title: place.name,
        });

        const info = new google.maps.InfoWindow({
          content: `<strong>${place.name}</strong><br>${place.formatted_address}<br>⭐ ${place.rating || 'N/A'}`,
        });

        marker.addListener("click", () => info.open(map, marker));
      });
    }

    // 페이지 로드시 Google Maps SDK 로드
    loadGoogleMaps();
  </script>
</body>
</html>
